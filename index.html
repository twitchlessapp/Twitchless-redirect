<!DOCTYPE html>
<html>
  <head>
    <title>Logging you in...</title>
    <script>
      async function exchangeCodeForToken() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");

        if (!code) {
          document.body.innerText = "❌ Missing authorization code.";
          return;
        }

        // Replace with your actual client info
        const clientId = "np31k7v4mdrp5d0m5sfqwtcbyop2gi";
        const clientSecret = "YOUR_CLIENT_SECRET"; // ⚠️ Don't expose this in production!
        const redirectUri = "https://twitchlessapp.github.io";

        try {
          const response = await fetch("https://id.twitch.tv/oauth2/token", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: new URLSearchParams({
              client_id: clientId,
              client_secret: clientSecret,
              code: code,
              grant_type: "authorization_code",
              redirect_uri: redirectUri,
            }),
          });

          const data = await response.json();

          if (data.access_token) {
            const token = data.access_token;
            // Redirect into your app
            window.location.href = "twitchless://auth#access_token=" + token;
          } else {
            document.body.innerText = "❌ Token exchange failed.\n" + JSON.stringify(data, null, 2);
          }
        } catch (err) {
          document.body.innerText = "❌ Error: " + err.message;
        }
      }

      exchangeCodeForToken();
    </script>
  </head>
  <body>
    <p>Logging you in…</p>
  </body>
</html>
